name: queryfoundry-scale
services:
  database:
    image: queryfoundry-database
    ports:
      - "127.0.0.1:55223:22"
    environment:
      POSTGRES_PASSWORD: ${QF_ADMIN_PASSWORD:?Use local env file}
      QF_PG_PASSWORD: ${QF_PG_PASSWORD:?Use local env file}
    volumes:
      - queryfoundry-scale-data:/var/lib/postgresql/data
      - ./.runtime/ssh-key.pub:/run/qf_authorized_keys:ro
    mem_limit: 2g
    cpus: 2
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  queryfoundry-scale-data:
